{% extends 'vehicle/customerbase.html' %}
{% load static %}
{% block content %}

<style>
  .profile-page {
    padding: 36px;
    min-height: calc(100vh - 70px);
    color: #ffffff;
  }

  .profile-card {
    max-width: 760px;
    margin: 50px auto 0;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid rgba(96, 165, 250, 0.25);
    border-radius: 26px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.35);
    padding: 36px;
    text-align: center;
  }

  .profile-img {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #3b82f6;
    box-shadow: 0 0 25px rgba(59,130,246,0.45);
    margin-bottom: 18px;
  }

  .profile-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 28px;
  }

  .profile-title span {
    color: #3b82f6;
  }

  .profile-info {
    display: grid;
    gap: 16px;
    text-align: left;
    margin-bottom: 30px;
  }

  .info-row {
    background: rgba(2, 8, 23, 0.7);
    border: 1px solid rgba(96,165,250,0.16);
    border-radius: 16px;
    padding: 16px 18px;
    color: #cbd5e1;
    font-size: 16px;
  }

  .info-row b {
    color: #60a5fa;
    margin-right: 8px;
  }

  .edit-btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #ffffff;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 14px 30px rgba(59,130,246,0.35);
    transition: 0.25s ease;
  }

  .edit-btn:hover {
    transform: translateY(-2px);
    color: #ffffff;
    text-decoration: none;
  }
</style>

<div class="profile-page">
  <div class="profile-card">

    <img src="{% if customer.profile_pic %}{% static customer.profile_pic.url %}{% else %}{% static 'images/admin.png' %}{% endif %}"
         alt="User image"
         class="profile-img">

    <div class="profile-title">
      Customer <span>Profile</span>
    </div>

    <div class="profile-info">
      <div class="info-row"><b>Name:</b> {{ customer }}</div>
      <div class="info-row"><b>Mobile:</b> {{ customer.mobile }}</div>
      <div class="info-row"><b>Address:</b> {{ customer.address }}</div>
    </div>

    <a href="/edit-customer-profile" class="edit-btn">Edit Profile</a>

  </div>
</div>

{% endblock content %}
