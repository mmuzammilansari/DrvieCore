<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="utf-8" />
  {% load bootstrap5 %}
  {% bootstrap_css %}
  {% bootstrap_javascript %}

  <style>
    .drive-navbar {
      width: 100%;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(96, 165, 250, 0.18);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .drive-navbar .navbar-brand img {
      width: 170px;
      height: auto;
      object-fit: contain;
    }

    .drive-navbar .navbar-nav {
      gap: 14px;
      align-items: center;
    }

    .drive-navbar .nav-link {
      color: #E5E7EB !important;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 18px !important;
      border-radius: 30px;
      transition: 0.3s ease;
      text-decoration: none;
    }

    .drive-navbar .nav-link:hover {
      color: #ffffff !important;
      background: rgba(37, 99, 235, 0.22);
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.22);
      transform: translateY(-2px);
    }

    .drive-navbar .nav-link.active {
      background: linear-gradient(to right, #2563EB, #3B82F6);
      color: #ffffff !important;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.35);
    }

    .drive-navbar .navbar-toggler {
      border: 1px solid rgba(96, 165, 250, 0.45);
      box-shadow: none;
    }

    .drive-navbar .navbar-toggler:focus {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .drive-navbar .navbar-toggler-icon {
      filter: invert(1);
    }

    @media (max-width: 768px) {
      .drive-navbar .navbar-collapse {
        margin-top: 18px;
        padding: 18px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(96, 165, 250, 0.18);
      }

      .drive-navbar .navbar-nav {
        gap: 8px;
      }

      .drive-navbar .nav-link {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-md drive-navbar">
    <div class="container">

      <a class="navbar-brand" href="/">
        <img src="{% static 'images/2.png' %}" alt="DriveCore Logo">
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#driveNavbar"
        aria-controls="driveNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="driveNavbar">
        <div class="navbar-nav">

          <a href="/customer" class="nav-item nav-link">Customer</a>
          <a href="/mechanics" class="nav-item nav-link">Mechanics</a>
          <a href="/aboutus" class="nav-item nav-link">About Us</a>
          <a href="/contactus" class="nav-item nav-link">Contact Us</a>
          <a href="/service" class="nav-item nav-link active">Service</a>

        </div>
      </div>

    </div>
  </nav>

</body>
</html>
