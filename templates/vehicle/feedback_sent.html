{% extends 'vehicle/mechanicbase.html' %}
{% load static %}

{% block content %}

<style>
  .success-wrapper {
    min-height: calc(100vh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
    background: linear-gradient(135deg, #020817, #0b1f45, #123f91);
  }

  .success-card {
    width: 420px;
    padding: 42px 34px;
    text-align: center;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid rgba(96, 165, 250, 0.25);
    border-radius: 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.42);
  }

  .success-card img {
    width: 70px;
    margin-bottom: 22px;
  }

  .success-card h2 {
    margin: 0 0 12px;
    color: #ffffff;
    font-size: 25px;
    font-weight: 900;
  }

  .success-card p {
    margin: 0 0 28px;
    color: #cbd5e1;
    font-size: 15px;
  }

  .success-actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .success-btn {
    padding: 13px 20px;
    border-radius: 14px;
    text-decoration: none;
    color: #ffffff;
    font-weight: 800;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    box-shadow: 0 12px 28px rgba(59, 130, 246, 0.32);
  }

  .success-btn.secondary {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(96, 165, 250, 0.35);
  }

  .success-btn:hover {
    text-decoration: none;
    color: #ffffff;
    opacity: 0.94;
    transform: translateY(-1px);
  }
</style>

<div class="success-wrapper">
  <div class="success-card">
    <img src="{% static 'images/success.png' %}" alt="Success">

    <h2>Feedback Sent Successfully</h2>
    <p>Your feedback has been submitted to DriveCore admin.</p>

    <div class="success-actions">
      <a href="/mechanic-feedback" class="success-btn">Send Another</a>
      <a href="/mechanic-dashboard" class="success-btn secondary">Home</a>
    </div>
  </div>
</div>

{% endblock content %}
