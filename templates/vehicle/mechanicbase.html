<!DOCTYPE html>
{% load static %}
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="icon" type="image/png" href="{% static 'assets/AT-pro-logo.png' %}">
	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.css">
	<link rel="stylesheet" type="text/css" href="{% static 'fontawesome-free/css/all.min.css' %}">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">

	<style>
		:root {
			--dc-nav: #151a2a;
			--dc-sidebar: #202330;
			--dc-blue: #3b82f6;
			--dc-blue-light: #60a5fa;
			--dc-border: rgba(96, 165, 250, 0.25);
			--dc-text: #ffffff;
		}

		body {
			margin: 0;
			font-family: 'Roboto', sans-serif;
			background: linear-gradient(135deg, #020817, #0b1f45, #123f91);
			color: var(--dc-text);
		}

		.navbar {
			background: var(--dc-nav) !important;
			border-bottom: 1px solid var(--dc-border);
			z-index: 1000;
		}

		.navbar-brand-title {
			color: #ffffff;
			margin: 0;
			padding-left: 10px;
			font-weight: 900;
		}

		.navbar-brand-title span {
			color: var(--dc-blue);
		}

		.navbar-search {
			background: #111111 !important;
			border-radius: 40px;
			border: 1px solid rgba(96, 165, 250, 0.12);
		}

		.navbar-search-input {
			color: #ffffff !important;
		}

		.sidebar {
			background: var(--dc-sidebar) !important;
			border-right: 1px solid rgba(96, 165, 250, 0.12);
			z-index: 999;
		}

		.sidebar-nav-link,
		.dropdown-menu-link {
			color: #ffffff !important;
		}

		.sidebar-nav-link:hover {
			background: rgba(59, 130, 246, 0.18);
			color: var(--dc-blue-light) !important;
		}

		.content {
			margin-left: 80px;
			min-height: calc(100vh - 70px);
			background: linear-gradient(135deg, #020817, #0b1f45, #123f91);
			overflow-x: hidden;
		}

		.dropdown-menu {
			background: #111827 !important;
			border: 1px solid var(--dc-border);
			border-radius: 16px;
			padding: 10px;
		}

		.dropdown-menu-item button {
			width: 100%;
			background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
			border: none !important;
			border-radius: 12px;
			padding: 10px 18px;
			color: #ffffff;
			font-weight: 700;
			cursor: pointer;
		}

		.avt img {
			border: 2px solid var(--dc-blue);
			background: #0f172a;
		}
	</style>
</head>

<body class="overlay-scrollbar">

	<div class="navbar">
		<ul class="navbar-nav">
			<li class="nav-item">
				<a class="nav-link">
					<i class="fas fa-bars" onclick="collapseSidebar()"></i>
				</a>
			</li>

			<li class="nav-item">
				<a style="text-decoration:none;" href="/mechanic-dashboard">
					<h3 class="navbar-brand-title">Drive<span>Core</span></h3>
				</a>
			</li>
		</ul>

		<form class="navbar-search">
			<input type="text" name="Search" class="navbar-search-input" placeholder="What you looking for...">
			<i class="fas fa-search"></i>
		</form>

		<ul class="navbar-nav nav-right">
			<li class="nav-item mode">
				<a class="nav-link" href="#" onclick="switchTheme()">
					<i class="fas fa-moon dark-icon"></i>
					<i class="fas fa-sun light-icon"></i>
				</a>
			</li>

			<li class="nav-item avt-wrapper">
				<div class="avt dropdown">
					<img src="{% if mechanic.profile_pic %}{{ mechanic.profile_pic.url }}{% else %}{% static 'images/admin.png' %}{% endif %}" alt="Mechanic image" class="dropdown-toggle" data-toggle="user-menu">

					<ul id="user-menu" class="dropdown-menu">
						<li class="dropdown-menu-item">
							<a href="/mechanic-profile" class="dropdown-menu-link">
								<div><i class="fas fa-user-tie"></i></div>
								<span>Profile</span>
							</a>
						</li>

						<li class="dropdown-menu-item">
							<form method="POST" action="{% url 'logout' %}">
								{% csrf_token %}
								<button type="submit">Logout</button>
							</form>
						</li>
					</ul>
				</div>
			</li>
		</ul>
	</div>

	<div class="sidebar">
		<ul class="sidebar-nav">
			<li class="sidebar-nav-item">
				<a href="/mechanic-dashboard" class="sidebar-nav-link">
					<div><i class="fas fa-tachometer-alt"></i></div>
					<span>Dashboard</span>
				</a>
			</li>

			<li class="sidebar-nav-item">
				<a href="/mechanic-work-assigned" class="sidebar-nav-link">
					<div><i class="fas fa-car-crash"></i></div>
					<span>Work Assigned</span>
				</a>
			</li>

			<li class="sidebar-nav-item">
				<a href="/mechanic-salary" class="sidebar-nav-link">
					<div><i class="fas fa-rupee-sign"></i></div>
					<span>Salary</span>
				</a>
			</li>

			<li class="sidebar-nav-item">
				<a href="/mechanic-attendance" class="sidebar-nav-link">
					<div><i class="fas fa-calendar-week"></i></div>
					<span>Attendance</span>
				</a>
			</li>

			<li class="sidebar-nav-item">
				<a href="/mechanic-feedback" class="sidebar-nav-link">
					<div><i class="fas fa-comments"></i></div>
					<span>Feedback</span>
				</a>
			</li>
		</ul>
	</div>

	<div class="content">
		{% block content %}
		{% endblock content %}
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js"></script>
	<script src="{% static 'index.js' %}"></script>
</body>
</html>
