{% extends 'vehicle/mechanicbase.html' %}
{% load widget_tweaks %}
{% block content %}

<style>
    .status-page {
        padding: 36px;
        min-height: calc(100vh - 70px);
        color: #ffffff;
    }

    .status-card {
        max-width: 620px;
        margin: 50px auto;
        padding: 36px;
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.35);
    }

    .status-card h3 {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 900;
        text-align: center;
        color: #ffffff;
    }

    .status-card h3 span {
        color: #3b82f6;
    }

    .status-card p {
        margin: 0 0 28px;
        text-align: center;
        color: #cbd5e1;
        font-size: 14px;
    }

    .status-card label {
        display: block;
        margin-bottom: 10px;
        color: #bfdbfe;
        font-weight: 700;
    }

    .status-card select,
    .status-card input[type="text"],
    .status-card input[type="number"],
    .status-card textarea {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 18px;
        border: 1px solid #334155;
        background: #020817;
        color: #ffffff;
        border-radius: 14px;
        outline: none;
        font-size: 15px;
    }

    .status-card select:focus,
    .status-card input:focus,
    .status-card textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
    }

    .status-card input[type="submit"] {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(59, 130, 246, 0.35);
    }

    .status-card input[type="submit"]:hover {
        opacity: 0.95;
        transform: translateY(-1px);
    }
</style>

<div class="status-page">
    <div class="status-card">
        <h3>Update <span>Work Status</span></h3>
        <p>Change the current progress status of the assigned service request.</p>

        <form method="post">
            {% csrf_token %}

            <label>Status</label>
            {% render_field updateStatus.status class="form-control" %}

            <input type="submit" value="Update Status">
        </form>
    </div>
</div>

{% endblock content %}
