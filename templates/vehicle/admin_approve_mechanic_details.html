{% extends 'vehicle/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}

<style>
  .dc-form-wrapper {
    padding: 45px 30px;
    min-height: calc(100vh - 70px);
  }

  .dc-form-card {
    max-width: 560px;
    margin: 45px auto;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid rgba(96, 165, 250, 0.25);
    border-radius: 24px;
    padding: 34px;
    box-shadow: 0 20px 55px rgba(0,0,0,0.35);
  }

  .dc-form-card h3 {
    text-align: center;
    color: #ffffff;
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .dc-form-card p {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 28px;
  }

  .dc-form-card label {
    color: #cbd5e1;
    font-weight: 700;
    margin-bottom: 8px;
    display: block;
  }

  .dc-form-card input[type="text"],
  .dc-form-card input[type="number"],
  .dc-form-card select,
  .dc-form-card textarea {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 20px;
    background: #020817;
    color: #ffffff;
    border: 1px solid #334155;
    border-radius: 14px;
    outline: none;
  }

  .dc-form-card input:focus,
  .dc-form-card select:focus,
  .dc-form-card textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.18);
  }

  .dc-form-card input[type="submit"] {
    width: 100%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    padding: 15px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-weight: 900;
    font-size: 16px;
    box-shadow: 0 14px 30px rgba(59,130,246,0.35);
  }

  .dc-form-card input[type="submit"]:hover {
    opacity: 0.94;
    transform: translateY(-1px);
  }
</style>

<div class="dc-form-wrapper">
  <div class="dc-form-card">
    <h3>Approve Mechanic</h3>
    <p>Set mechanic salary according to skill and approve the account</p>

    <form method="post">
      {% csrf_token %}

      <label for="salary">Salary</label>
      {% render_field mechanicSalary.salary class="form-control" placeholder="Enter salary" %}

      <input type="submit" value="Approve Mechanic">
    </form>
  </div>
</div>

{% endblock content %}
