<!DOCTYPE html>
{% load static %}
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="icon" type="image/png" href="{% static 'assets/AT-pro-logo.png' %}">
	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.css">
	<link rel="stylesheet" type="text/css" href="{% static 'fontawesome-free/css/all.min.css' %}">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">

	<style>
		:root {
			--dc-bg: #020817;
			--dc-nav: #151a2a;
			--dc-sidebar: #202330;
			--dc-blue: #3b82f6;
			--dc-blue-light: #60a5fa;
			--dc-border: rgba(96, 165, 250, 0.25);
			--dc-text: #ffffff;
			--dc-muted: #cbd5e1;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: 'Roboto', sans-serif;
			background: linear-gradient(135deg, #020817, #0b1f45, #123f91);
			color: var(--dc-text);
		}

		.navbar {
			background: var(--dc-nav) !important;
			border-bottom: 1px solid var(--dc-border);
			z-index: 1000;
		}

		.navbar h3 {
			margin: 0;
			color: #ffffff;
			font-weight: 900;
			letter-spacing: 0.5px;
		}

		.navbar h3 span {
			color: var(--dc-blue);
		}

		.navbar-search {
			background: #111111 !important;
			border-radius: 40px;
			border: 1px solid rgba(96, 165, 250, 0.12);
		}

		.navbar-search-input {
			color: #ffffff !important;
		}

		.navbar-search-input::placeholder {
			color: #8b95a7;
		}

		.sidebar {
			background: var(--dc-sidebar) !important;
			border-right: 1px solid rgba(96, 165, 250, 0.12);
			z-index: 999;
		}

		.sidebar-nav-link {
			color: #ffffff !important;
		}

		.sidebar-nav-link i,
		.sidebar-nav-link h2 {
			color: #ffffff;
		}

		.sidebar-nav-link:hover {
			background: rgba(59, 130, 246, 0.18);
			color: var(--dc-blue-light) !important;
		}

		.sidebar-nav-link:hover i,
		.sidebar-nav-link:hover h2 {
			color: var(--dc-blue-light);
		}

		.content {
			margin-left: 80px;
			min-height: calc(100vh - 70px);
			background: linear-gradient(135deg, #020817, #0b1f45, #123f91);
			overflow-x: hidden;
		}

		.dropdown-menu {
			background: #111827 !important;
			border: 1px solid var(--dc-border);
			border-radius: 16px;
			box-shadow: 0 18px 40px rgba(0,0,0,0.35);
			padding: 10px;
		}

		.dropdown-menu-link {
			color: #ffffff !important;
			background: transparent;
			border: none;
			width: 100%;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 14px;
			border-radius: 12px;
			text-decoration: none;
			font-size: 14px;
		}

		.dropdown-menu-link:hover {
			background: rgba(59, 130, 246, 0.18);
			color: var(--dc-blue-light) !important;
		}

		.dropdown-menu-item form {
			margin: 0;
		}

		.avt img {
			border: 2px solid var(--dc-blue);
			background: #0f172a;
		}
	</style>
</head>

<body class="overlay-scrollbar">

	<div class="navbar">
		<ul class="navbar-nav">
			<li class="nav-item">
				<a class="nav-link">
					<i class="fas fa-bars" onclick="collapseSidebar()"></i>
				</a>
			</li>

			<li class="nav-item">
				<a style="text-decoration:none;" href="/customer-dashboard">
					<h3>Drive<span>Core</span></h3>
				</a>
			</li>
		</ul>

		<form class="navbar-search">
			<input type="text" name="Search" class="navbar-search-input" placeholder="Search service, invoice, request...">
			<i class="fas fa-search"></i>
		</form>

		<ul class="navbar-nav nav-right">
			<li class="nav-item mode">
				<a class="nav-link" href="#" onclick="switchTheme()">
					<i class="fas fa-moon dark-icon"></i>
					<i class="fas fa-sun light-icon"></i>
				</a>
			</li>

			<li class="nav-item avt-wrapper">
				<div class="avt dropdown">
					<img src="{% if customer.profile_pic %}{{ customer.profile_pic.url }}{% else %}{% static 'images/admin.png' %}{% endif %}"
						alt="User image" class="dropdown-toggle" data-toggle="user-menu">

					<ul id="user-menu" class="dropdown-menu">
						<li class="dropdown-menu-item">
							<a href="/customer-profile" class="dropdown-menu-link">
								<div><i class="fas fa-user-tie"></i></div>
								<span>Profile</span>
							</a>
						</li>

						<li class="dropdown-menu-item">
							<form method="POST" action="{% url 'logout' %}">
								{% csrf_token %}
								<button type="submit" class="dropdown-menu-link">
									<div><i class="fas fa-sign-out-alt"></i></div>
									<span>Logout</span>
								</button>
							</form>
						</li>
					</ul>
				</div>
			</li>
		</ul>
	</div>

	<div class="sidebar">
		<ul class="sidebar-nav">
			<li class="sidebar-nav-item">
				<a href="/customer-dashboard" class="sidebar-nav-link">
					<div><i class="fas fa-tachometer-alt"></i></div>
					<span>Dashboard</span>
				</a>
			</li>

			<li class="sidebar-nav-item">
				<a href="/customer-request" class="sidebar-nav-link">
					<div><i class="fas fa-car-crash"></i></div>
					<span>Request</span>
				</a>
			</li>

			<li class="sidebar-nav-item">
				<a href="/customer-invoice" class="sidebar-nav-link">
					<div><i class="fas fa-file-invoice-dollar"></i></div>
					<span>Invoice</span>
				</a>
			</li>

			<li class="sidebar-nav-item">
				<a href="/customer-feedback" class="sidebar-nav-link">
					<div><i class="fas fa-comments"></i></div>
					<span>Feedback</span>
				</a>
			</li>
		</ul>
	</div>

	<div class="content">
		{% block content %}
		{% endblock content %}
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js"></script>
	<script src="{% static 'index.js' %}"></script>
</body>
</html>
