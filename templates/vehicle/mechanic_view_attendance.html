{% extends 'vehicle/mechanicbase.html' %}
{% load static %}
{% block content %}

<style>
    .attendance-page {
        padding: 34px;
        min-height: calc(100vh - 70px);
        color: #ffffff;
    }

    .attendance-card {
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(0,0,0,0.35);
        overflow: hidden;
    }

    .attendance-header {
        padding: 24px 28px;
        border-bottom: 1px solid rgba(96, 165, 250, 0.2);
    }

    .attendance-header h3 {
        margin: 0;
        color: #ffffff;
        font-size: 24px;
        font-weight: 800;
    }

    .attendance-header span {
        color: #3b82f6;
    }

    .attendance-table {
        width: 100%;
        border-collapse: collapse;
    }

    .attendance-table th {
        background: rgba(37, 99, 235, 0.18);
        color: #bfdbfe;
        padding: 16px;
        text-align: left;
    }

    .attendance-table td {
        padding: 16px;
        color: #e5e7eb;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .attendance-table tr:hover {
        background: rgba(59, 130, 246, 0.08);
    }
</style>

<div class="attendance-page">
    <div class="attendance-card">
        <div class="attendance-header">
            <h3>Your <span>Attendance</span></h3>
        </div>

        <table class="attendance-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Present / Absent</th>
                </tr>
            </thead>

            <tbody>
                {% for w in attendaces %}
                <tr>
                    <td>{{ w.date }}</td>
                    <td>{{ w.present_status }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2">No attendance record found</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock content %}
